<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disponibilidade do Professor</title>
    <link rel="stylesheet" href="css/dashboardCoordenador.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-wrapper {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 16px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            border: 1px solid #eef2f7;
            padding: 22px;
        }
        .card h1 {
            margin: 0 0 6px;
            font-size: 22px;
            color: #0f172a;
        }
        .card p {
            margin: 0 0 16px;
            color: #475569;
        }
        .disp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }
        .disp-table th,
        .disp-table td {
            border: 1px solid #e5e7eb;
            padding: 10px;
            text-align: center;
        }
        .disp-table th {
            background: #f8fafc;
            font-weight: 700;
            color: #0f172a;
        }
        .disp-table input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0D6EFD, #0bb8ff);
            color: #fff;
            box-shadow: 0 10px 25px rgba(13,110,253,0.25);
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .btn-secondary {
            background: #e2e8f0;
            color: #0f172a;
        }
        .notice {
            margin-top: 12px;
            font-size: 13px;
            color: #475569;
        }
        .status {
            margin-top: 10px;
            font-size: 13px;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <button class="floating-logout"><i class="fas fa-sign-out-alt"></i> Sair</button>
    <div class="page-wrapper">
        <div class="card">
            <h1>Disponibilidade do Professor</h1>
            <p>Marque os horários em que você pode lecionar. Salve para atualizar seu cadastro.</p>
            <div id="userInfo" class="notice"></div>

            <div id="gridWrapper"></div>

            <div class="card" style="margin-top:16px; border:1px solid #e5e7eb;">
                <h2 style="margin:0 0 8px; font-size:18px; color:#0f172a;">Turmas em que leciona</h2>
                <p class="notice" style="margin-top:0;">Visualize as aulas já geradas para você.</p>
                <div id="aulasWrapper"></div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" id="btnReset">Desmarcar tudo</button>
                <button class="btn btn-primary" id="btnSave">Salvar disponibilidade</button>
            </div>
            <div class="status" id="statusMsg"></div>
        </div>
    </div>

    <script src="js/disponibilidadeProfessor.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
